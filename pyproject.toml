[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ce-pinn"
version = "0.1.0"
description = "Conservation-embedded physics-informed neural networks: a differentiable Helmholtz projection for derivative-dependent integral invariants."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Aamir Shehzad", email = "aamir.shehzad@giki.edu.pk" },
    { name = "Sirajul Haq", email = "siraj@giki.edu.pk" },
]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "wandb>=0.15",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/aamirpreneur/ce-pinn"

[tool.setuptools.packages.find]
include = ["ce_pinn*"]
